    const newsGrid = document.getElementById('newsGrid');
    const filterButtons = document.querySelectorAll('.news-filter');
    let currentNewsLang = localStorage.getItem('inloop-language') || 'es';

    function getVisibleNews() {
      const activeItems = newsItems[currentNewsLang] || newsItems.es;
      return activeItems
        .filter(item => item.published)
        .sort((a, b) => new Date(b.dateKey || '1970-01-01') - new Date(a.dateKey || '1970-01-01'));
    }

    function renderNews(filter = 'all') {
      const visibleNews = getVisibleNews();
      const filtered = filter === 'all'
        ? visibleNews
        : visibleNews.filter(item => item.filter === filter);

      newsGrid.innerHTML = filtered.map((item, index) => {
        const href = item.type === 'external' && item.url ? item.url : item.type === 'internal' && item.slug ? `./${item.slug}/` : '';
        const tagName = href ? 'a' : 'article';
        const externalIcon = item.type === 'external' && item.url
          ? '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3L6 10M9 13H3V7"/></svg>'
          : '';

        return `
          <${tagName}
            class="news-card ${item.type} ${index === 0 ? 'featured' : ''}"
            ${href ? `href="${href}"` : ''}
            ${item.type === 'external' && item.url ? 'target="_blank" rel="noopener noreferrer"' : ''}
            aria-label="${item.title}"
          >
            <div class="news-card-media ${item.imageAlign === 'right' ? 'media-shift-right' : ''}">
              <img src="${item.image}" alt="${item.title}" />
            </div>
            <div class="news-card-content">
              <div class="news-meta-row">
                <span class="news-category">${item.category}</span>
                <span class="news-date">${item.date}</span>
              </div>
              <h3>${item.title}</h3>
              <p>${item.description}</p>
              <span class="news-card-cta">
                ${item.cta}
                ${externalIcon}
              </span>
            </div>
          </${tagName}>
        `;
      }).join('');
    }

    function syncNewsLanguage(lang) {
      currentNewsLang = lang;
      const activeFilter = document.querySelector('.news-filter.active')?.dataset.filter || 'all';
      renderNews(activeFilter);
    }

    window.addEventListener('languageChanged', (event) => {
      syncNewsLanguage(event.detail || localStorage.getItem('inloop-language') || 'es');
    });

    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        syncNewsLanguage(button.dataset.lang);
      });
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        const filter = button.dataset.filter;
        filterButtons.forEach(item => {
          const active = item === button;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        renderNews(filter);
      });
    });

    syncNewsLanguage(currentNewsLang);
